<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服话术</title>
<style>
  :root{--navy:#1f3a5f;--blue:#2e6db4;--grey:#666;--line:#e3e9f2;--warnbg:#fdecea;--warntx:#c0392b;--okbg:#eaf1fa;--oktx:#1e7a3c;}
  *{box-sizing:border-box;}
  body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;margin:0;background:#f5f7fa;color:#222;line-height:1.7;}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px;}
  header{text-align:center;padding:18px 12px 6px;}
  header h1{color:var(--navy);font-size:20px;margin:0 0 6px;}
  header .sub{color:var(--grey);font-size:12px;}
  .toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 16px;}
  .toolbar button{border:1px solid var(--blue);background:#fff;color:var(--blue);padding:7px 16px;border-radius:20px;font-size:13px;cursor:pointer;}
  .toolbar button:hover{background:var(--blue);color:#fff;}
  .search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:16px;outline:none;}
  .search:focus{border-color:var(--blue);}
  .item{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .head{display:flex;align-items:center;gap:10px;cursor:pointer;padding:15px 16px;user-select:none;}
  .head:hover{background:#f7faff;}
  .arrow{color:var(--blue);font-size:14px;transition:transform .2s;flex:none;width:16px;text-align:center;}
  .item.open .arrow{transform:rotate(90deg);}
  .head .num{background:var(--navy);color:#fff;font-size:12px;font-weight:700;min-width:24px;height:24px;padding:0 5px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;}
  .head .title{font-weight:700;color:var(--navy);font-size:15px;}
  .head .tag{font-size:11px;font-weight:700;color:#fff;background:#e08a1e;padding:2px 8px;border-radius:10px;flex:none;margin-left:auto;}
  .body{display:none;padding:0 16px 16px;border-top:1px solid var(--line);}
  .item.open .body{display:block;}
  .scene{color:var(--grey);font-size:13px;margin:12px 0 10px;}
  .scene b{color:var(--navy);}
  .card{border-radius:8px;padding:11px 13px;margin:9px 0;font-size:14px;}
  .bad{background:var(--warnbg);}
  .bad .lbl{color:var(--warntx);font-weight:700;font-size:13px;}
  .bad .txt{color:#7a7a7a;margin-top:4px;}
  .good{background:var(--okbg);}
  .good .lbl{color:var(--oktx);font-weight:700;font-size:13px;}
  .good .txt{margin-top:4px;color:#1b2a3a;}
  .pt{font-size:13px;color:var(--grey);margin-top:10px;}
  .pt b{color:var(--blue);}
  #gate{position:fixed;inset:0;background:#1f3a5f;display:flex;align-items:center;justify-content:center;z-index:9999;}
  #gate .box{background:#fff;border-radius:14px;padding:28px 26px;width:300px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3);}
  #gate h2{margin:0 0 6px;color:var(--navy);font-size:18px;}
  #gate p{margin:0 0 16px;color:var(--grey);font-size:12px;}
  #gate input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px;text-align:center;outline:none;}
  #gate input:focus{border-color:var(--blue);}
  #gate button{width:100%;margin-top:12px;padding:11px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-size:15px;cursor:pointer;}
  #gate .err{color:var(--warntx);font-size:12px;margin-top:10px;min-height:16px;}
  #app{display:none;}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2>客服话术</h2>
    <p>请输入访问密码</p>
    <input id="pw" type="password" placeholder="密码" autocomplete="off">
    <button onclick="tryUnlock()">进入</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app">
  <div class="wrap">
    <header>
      <h1>澳洲集运 · 客服话术</h1>
      <div class="sub">点标题展开 · 可搜索 · 实时更新</div>
    </header>
    <div class="toolbar">
      <button onclick="setAll(true)">展开全部</button>
      <button onclick="setAll(false)">收起全部</button>
    </div>
    <input class="search" id="q" placeholder="🔍 关键词筛选（如：封港 / 赔付 / 发票 / 爆雷）" oninput="filt()">
    <div id="list"></div>
  </div>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CIPHER));
  return new TextDecoder().decode(pt);
}
async function tryUnlock(){
  const pw=document.getElementById('pw').value;
  try{
    const txt=await decrypt(pw);
    window.DATA=JSON.parse(txt);
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    render();
    try{sessionStorage.setItem('hspw',pw);}catch(e){}
  }catch(e){ document.getElementById('err').textContent='密码错误，请重试'; }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
(function(){try{const p=sessionStorage.getItem('hspw');if(p){document.getElementById('pw').value=p;tryUnlock();}}catch(e){}})();

function render(){
  const list=document.getElementById('list');list.innerHTML='';
  const data=window.DATA;
  data.forEach(d=>{
    const bad=d.bad?`<div class="card bad"><div class="lbl">✗ 不建议这样说</div><div class="txt">${d.bad}</div></div>`:"";
    const pt=d.pt?`<div class="pt"><b>💡 沟通要点：</b>${d.pt}</div>`:"";
    const tag=d.tag?`<span class="tag">${d.tag}</span>`:"";
    const el=document.createElement('div');el.className='item';
    el.dataset.text=(d.t+d.s+d.good+d.pt).toLowerCase();
    el.innerHTML=`<div class="head" onclick="this.parentElement.classList.toggle('open')">
      <span class="arrow">▶</span><span class="num">${d.n}</span><span class="title">${d.t}</span>${tag}</div>
      <div class="body"><div class="scene"><b>【适用场景】</b>${d.s}</div>${bad}
      <div class="card good"><div class="lbl">✓ 推荐话术</div><div class="txt">${d.good}</div></div>${pt}</div>`;
    list.appendChild(el);
  });
}
function setAll(o){document.querySelectorAll('.item').forEach(it=>it.classList.toggle('open',o));}
function filt(){
  const q=document.getElementById('q').value.trim().toLowerCase();let n=0;
  document.querySelectorAll('.item').forEach(it=>{
    const hit=!q||it.dataset.text.includes(q);it.style.display=hit?'':'none';
    if(hit){n++;if(q)it.classList.add('open');}
  });
}
